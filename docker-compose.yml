services:
  composer:
    build:
      context: .
      dockerfile: docker/composer/composer.dockerfile
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
  php:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - laravel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.archivarius.rule=Host(`archivarius.ufamasters.ru`)"
      - "traefik.http.routers.archivarius.entrypoints=websecure"
      - "traefik.http.routers.archivarius.tls.certresolver=myresolver"

      - "traefik.http.routers.archivarius-insecure.rule=Host(`archivarius.ufamasters.ru`)"
      - "traefik.http.routers.archivarius-insecure.entrypoints=web"
      - "traefik.http.routers.archivarius-insecure.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  mysql:
    image: mysql:8.0.38-debian
    environment:
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u${DB_USERNAME} -p${DB_PASSWORD} || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    networks:
      - laravel

  worker:
    build:
      context: .
      dockerfile: docker/php/php.dockerfile
    volumes:
      - ./:/var/www/html
    networks:
      - laravel
    command: >
      sh -c "php artisan queue:work redis --queue=broadcast.telegram --tries=3 --timeout=90"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
networks:
  laravel:
volumes:
  db_data:
