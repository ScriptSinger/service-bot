stages:
  - build
  - deploy

variables:
  GIT_STRATEGY: clone

build_release:
  stage: build
  image: php:8.2
  only:
    - main
    - test

  before_script:
    - apt-get update && apt-get install -y unzip git curl npm

    # Установка Composer
    - curl -sS https://getcomposer.org/installer | php
    - mv composer.phar /usr/local/bin/composer

  script:
    - composer install --no-dev --prefer-dist --optimize-autoloader

    # Если есть фронт
    - if [ -f package.json ]; then npm ci; npm run build || npm run prod; fi

    # Кэширование Laravel
    - php artisan config:cache || true
    - php artisan route:cache || true
    - php artisan view:cache || true

    # Создание архива для деплоя
    - tar -czf release.tar.gz \
        app \
        bootstrap \
        config \
        database \
        docker \
        lang \
        public \
        resources \
        routes \
        storage \
        artisan \
        composer.json \
        composer.lock \
        docker-compose.yml \
        package.json \
        package-lock.json \
        .env.example

  artifacts:
    paths:
      - release.tar.gz
    expire_in: 1 hour

deploy_production:
  stage: deploy
  image: alpine:latest
  only:
    - main
    - ci-test
  dependencies:
    - build_release

  before_script:
    - apk add --no-cache openssh

    # Настройка SSH ключа
    - mkdir -p ~/.ssh
    - echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

  script:
    - scp -i ~/.ssh/id_ed25519 release.tar.gz $SSH_USER@$SSH_HOST:/tmp/release.tar.gz
    - ssh -i ~/.ssh/id_ed25519 $SSH_USER@$SSH_HOST << 'EOF'
        set -e

        cd ~/archivarius

        tar -xzf /tmp/release.tar.gz -C ~/archivarius

        echo "$ENV_FILE" | base64 -d > .env

        docker compose down
        docker system prune -af
        docker compose up -d --build

        docker compose run --rm composer composer install --no-dev --optimize-autoloader
        docker compose run --rm php php artisan migrate --force
        docker compose run --rm php php artisan optimize
     EOF

